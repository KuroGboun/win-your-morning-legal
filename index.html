<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win Your Morning — the alarm your friends set for you</title>
<meta name="description" content="The alarm your friends set for you. Promise your morning the night before, prove it with a photo before the squad's deadline — or get crowned Bum of the Day.">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#4C86C6">

<meta property="og:type" content="website">
<meta property="og:title" content="Win Your Morning">
<meta property="og:description" content="The alarm your friends set for you. Promise your morning the night before, prove it with a photo before the squad's deadline — or get crowned Bum of the Day.">
<meta property="og:url" content="https://kurogboun.github.io/win-your-morning-legal/">
<meta property="og:image" content="https://kurogboun.github.io/win-your-morning-legal/assets/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Win Your Morning">
<meta name="twitter:description" content="The alarm your friends set for you. Prove your morning before the squad's deadline — or get crowned Bum of the Day.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,300;10..48,400;10..48,500;10..48,600;10..48,700;10..48,800&display=swap" rel="stylesheet">

<style>
  *{box-sizing:border-box}
  :root{
    --paper:#FFFFFF; --ink:#1E2A24; --forest:#2E4A3B; --forest-d:#22382E;
    --terra:#C4562F; --terra-soft:#DB7A54; --gold:#E0A032; --amber:#F2B84B;
    --cream:#F4ECD8; --plum:#3A2E4A;
    --cta:#E0A032; --cta-text:#1E2A24;
  }
  html,body{margin:0}
  body{font-family:'Bricolage Grotesque',sans-serif; background:#4C86C6; color:var(--ink); -webkit-font-smoothing:antialiased;}
  a{color:var(--terra); text-decoration:none}
  a:hover{color:var(--terra-soft)}

  .page{width:100%; max-width:1440px; margin:0 auto; overflow:hidden; background:var(--paper)}

  /* ── Hero ─────────────────────────────────────────────────────────── */
  .hero{position:relative; min-height:940px; overflow:hidden; display:flex; flex-direction:column;
        background:linear-gradient(178deg,#6FA3DA 0%,#4C86C6 34%,#8DB8E4 72%,#CFE0F1 100%);}
  .cloud{position:absolute; border-radius:50%; pointer-events:none}
  .c1{left:-60px; top:120px; width:460px; height:240px; background:rgba(255,255,255,.42); filter:blur(38px)}
  .c2{right:-80px; top:300px; width:560px; height:300px; background:rgba(255,255,255,.36); filter:blur(46px)}
  .c3{left:18%; bottom:40px; width:62%; height:320px; background:rgba(255,255,255,.5); filter:blur(56px)}

  /* Floaters — draggable emoji. Size carried in --s so media queries can scale
     the whole cluster with one calc(); positions are % of the hero. */
  .float{position:absolute; width:var(--s); height:var(--s); cursor:grab; touch-action:none;
         filter:drop-shadow(0 16px 22px rgba(20,40,70,.26)); z-index:2}
  .float img{width:100%; height:100%; object-fit:contain; display:block;
             pointer-events:none; -webkit-user-drag:none; user-select:none; -webkit-touch-callout:none}
  @keyframes bobA{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-18px) rotate(-2deg)}}
  @keyframes bobB{0%,100%{transform:translateY(0) rotate(7deg)}50%{transform:translateY(-24px) rotate(2deg)}}
  @keyframes bobC{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-13px) rotate(4deg)}}
  .bobA{animation:bobA 8s ease-in-out infinite}
  .bobB{animation:bobB 8.4s ease-in-out infinite}
  .bobC{animation:bobC 7.6s ease-in-out infinite}

  /* ── Nav ──────────────────────────────────────────────────────────── */
  .nav{position:relative; z-index:3; display:flex; align-items:center; justify-content:space-between; padding:26px 44px}
  .brand{display:flex; align-items:center; gap:8px; color:var(--cream)}
  .brand span{font-size:13px; font-weight:800; letter-spacing:-.01em; line-height:.9}
  .nav-cta{display:inline-flex; align-items:center; font-size:15px; font-weight:700;
           color:var(--cta-text); background:var(--cta); padding:13px 24px; border-radius:999px}

  /* ── Hero content ─────────────────────────────────────────────────── */
  .content{position:relative; z-index:3; padding:66px 72px 40px; max-width:820px}
  .kicker{display:inline-block; transform:rotate(-4deg); background:var(--terra); color:var(--cream);
          font-size:11px; font-weight:800; letter-spacing:.14em; padding:7px 12px; border-radius:8px}
  h1{margin:26px 0 0; font-size:clamp(52px,13vw,150px); font-weight:800; line-height:.8;
     letter-spacing:-.05em; color:var(--cream)}
  .squiggle{display:block; margin-top:12px; width:min(420px,64%); height:auto}
  .caption{font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
           font-size:clamp(17px,2vw,26px); line-height:1.4; color:rgba(244,236,216,.92);
           margin-top:28px; max-width:560px}

  form{display:flex; align-items:center; gap:10px; margin-top:36px; max-width:560px}
  .email{flex:1; min-width:0; font-family:-apple-system,'SF Pro Text',system-ui,sans-serif;
         font-size:17px; color:var(--ink); background:var(--cream);
         border:1px solid rgba(30,42,36,.14); border-radius:16px; padding:18px 20px; outline:none}
  .email:disabled{opacity:.85}
  .join{font-family:'Bricolage Grotesque',sans-serif; font-size:19px; font-weight:700; letter-spacing:-.01em;
        color:var(--cta-text); background:var(--cta); border:0; border-radius:16px; padding:19px 30px;
        cursor:pointer; white-space:nowrap; transition:opacity .15s}
  .join:disabled{cursor:default; opacity:.9}
  .hp{position:absolute; left:-9999px; width:1px; height:1px; opacity:0; overflow:hidden}
  .msg{min-height:16px; font-family:-apple-system,system-ui,sans-serif; font-size:14px;
       color:var(--cream); margin-top:12px; max-width:560px}
  .counter{font-size:11px; font-weight:700; letter-spacing:.16em; color:rgba(244,236,216,.78); margin-top:14px}

  /* ── Tablet ───────────────────────────────────────────────────────── */
  @media (max-width:1024px){
    .float{width:calc(var(--s)*.66); height:calc(var(--s)*.66)}
    .content{padding:60px 48px 40px}
    #f7{display:none}
  }

  /* ── Phone ────────────────────────────────────────────────────────── */
  @media (max-width:640px){
    .hero{min-height:100svh}
    .nav{padding:18px 20px}
    .nav-cta{font-size:13px; padding:10px 16px}
    /* Keep the top-cluster five, hide the ones that would sit over the copy. */
    #f6,#f7,#f8,#f10,#f13{display:none}
    .float{width:calc(var(--s)*.52); height:calc(var(--s)*.52)}
    #f1{left:4%;  top:15%}
    #f4{left:31%; top:9%}
    #f2{left:66%; top:11%}
    #f5{left:50%; top:25%}
    #f3{left:82%; top:22%}
    /* Push the copy below the floater band, full width. */
    .content{padding:38% 20px 48px; max-width:none}
    h1{letter-spacing:-.04em}
    .caption{margin-top:22px}
    form{flex-direction:column; align-items:stretch; gap:12px}
    .email,.join{width:100%; text-align:center}
    .join{padding:18px 24px}
  }
  @media (max-width:380px){
    .content{padding:44% 18px 40px}
  }
</style>
</head>
<body>

<div class="page">
  <section class="hero">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>

    <!-- Floating draggable emoji -->
    <div class="float bobA" id="f1"  data-float="obj1"  style="--s:92px;  left:55.6%; top:12.4%"><img src="assets/emoji-obj1.png"  alt=""></div>
    <div class="float bobC" id="f2"  data-float="obj2"  style="--s:114px; left:74.8%; top:10.5%"><img src="assets/emoji-obj2.png"  alt=""></div>
    <div class="float bobB" id="f3"  data-float="obj3"  style="--s:88px;  left:90.9%; top:22.6%"><img src="assets/emoji-obj3.png"  alt=""></div>
    <div class="float bobB" id="f4"  data-float="obj4"  style="--s:106px; left:61.4%; top:28.1%"><img src="assets/emoji-obj4.png"  alt=""></div>
    <div class="float bobA" id="f5"  data-float="obj5"  style="--s:124px; left:79.2%; top:29.1%"><img src="assets/emoji-obj5.png"  alt=""></div>
    <div class="float bobC" id="f6"  data-float="obj6"  style="--s:94px;  left:53.9%; top:45.3%"><img src="assets/emoji-obj6.png"  alt=""></div>
    <div class="float bobC" id="f7"  data-float="obj7"  style="--s:84px;  left:69.3%; top:50.1%"><img src="assets/emoji-obj7.png"  alt=""></div>
    <div class="float bobA" id="f8"  data-float="obj8"  style="--s:100px; left:88.7%; top:48.4%"><img src="assets/emoji-obj8.png"  alt=""></div>
    <div class="float bobB" id="f10" data-float="obj10" style="--s:118px; left:56.6%; top:64.5%"><img src="assets/emoji-obj10.png" alt=""></div>
    <div class="float bobC" id="f13" data-float="obj13" style="--s:102px; left:79.4%; top:65.1%"><img src="assets/emoji-obj13.png" alt=""></div>

    <!-- Nav -->
    <div class="nav">
      <div class="brand">
        <svg width="34" height="34" viewBox="0 0 120 120" aria-hidden="true"><defs><radialGradient id="navSun" cx="50%" cy="55%" r="55%"><stop offset="0" stop-color="#F2B84B"></stop><stop offset="1" stop-color="#C4562F"></stop></radialGradient></defs><circle cx="60" cy="60" r="44" fill="url(#navSun)"></circle></svg>
        <span>WIN<br>YOUR<br>MORNING</span>
      </div>
      <a href="#get" class="nav-cta">Join the waitlist</a>
    </div>

    <!-- Content -->
    <div class="content">
      <span class="kicker">RISE OR BE ROASTED</span>
      <h1>Win your<br>morning</h1>
      <svg class="squiggle" width="420" height="24" viewBox="0 0 420 24" fill="none" stroke="#E0A032" stroke-width="7" stroke-linecap="round" aria-hidden="true"><path d="M6 15 Q 42 5 78 13 T 150 13 T 222 13 T 294 13 T 366 12 T 414 11"></path></svg>
      <p class="caption">The alarm your friends set for you. Promise your morning the night before, prove it with a photo before the squad's deadline — or get crowned Bum of the Day.</p>

      <form id="get" novalidate>
        <input class="email" id="email" type="email" inputmode="email" autocomplete="email" placeholder="Your email" aria-label="Your email" />
        <input class="hp" id="website" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <button class="join" id="joinBtn" type="submit">Join the waitlist</button>
      </form>
      <div class="msg" id="formMsg" role="status" aria-live="polite"></div>
      <div class="counter" id="counter">68 PEOPLE AHEAD OF YOU</div>
    </div>
  </section>
</div>

<script>
/* ── Waitlist ─────────────────────────────────────────────────────────── */
(function () {
  var API = 'https://bdwaqpnycvywhhuzhlga.supabase.co/functions/v1/waitlist';
  var KEY = 'wym.lp.joined';
  var form = document.getElementById('get');
  var input = document.getElementById('email');
  var btn = document.getElementById('joinBtn');
  var hp = document.getElementById('website');
  var counter = document.getElementById('counter');
  var msg = document.getElementById('formMsg');

  function renderJoined(n) {
    btn.textContent = "YOU'RE IN ☀️";
    btn.disabled = true;
    input.disabled = true;
    if (n) counter.textContent = "YOU'RE #" + n + " ON THE LIST";
    msg.textContent = '';
  }

  // Returning visitor who already joined on this device.
  if (localStorage.getItem(KEY)) renderJoined();

  // Live count — silently leaves the static "68" fallback if it fails.
  fetch(API).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.ok && typeof d.count === 'number' && !localStorage.getItem(KEY)) {
      counter.textContent = d.count + ' PEOPLE AHEAD OF YOU';
    }
  }).catch(function () {});

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (btn.disabled) return;
    var email = (input.value || '').trim();
    if (!email) { input.focus(); return; }
    var restore = btn.textContent;
    btn.disabled = true;
    btn.textContent = 'JOINING…';
    msg.textContent = '';
    var src = new URLSearchParams(location.search).get('src');
    fetch(API, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ email: email, source: src, website: hp.value })
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.ok && d.joined) {
        localStorage.setItem(KEY, '1');
        renderJoined(d.count);
      } else {
        btn.disabled = false;
        btn.textContent = restore;
        msg.textContent = d && d.error === 'invalid_email' ? 'That email looks off — mind checking it?'
          : d && d.error === 'rate_limited' ? 'Whoa, slow down a sec.'
          : 'Hmm, try again in a moment.';
      }
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = restore;
      msg.textContent = 'Network hiccup — try again.';
    });
  });
})();

/* ── Drag the floaters (desktop + touch) ──────────────────────────────── */
(function () {
  var KEY = 'wym.lp.floaters.v2';
  var drag = null, applied = {};

  function store() { try { return JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { return {}; } }
  function save() {
    var all = store();
    var k = drag.el.getAttribute('data-float');
    all[k] = { left: drag.el.style.left, top: drag.el.style.top };
    applied[k] = true;
    try { localStorage.setItem(KEY, JSON.stringify(all)); } catch (e) {}
  }
  function restoreAll() {
    var all = store();
    Object.keys(all).forEach(function (k) {
      if (applied[k]) return;
      var el = document.querySelector('[data-float="' + k + '"]');
      if (!el) return;
      applied[k] = true;
      el.style.animation = 'none';
      el.style.right = 'auto'; el.style.bottom = 'auto';
      el.style.left = all[k].left; el.style.top = all[k].top;
    });
  }

  document.addEventListener('pointerdown', function (e) {
    var el = e.target.closest && e.target.closest('[data-float]');
    if (!el) return;
    var p = el.offsetParent || el.parentElement;
    var r = el.getBoundingClientRect(), pr = p.getBoundingClientRect();
    el.style.animation = 'none';
    el.style.left = (r.left - pr.left) + 'px';
    el.style.top = (r.top - pr.top) + 'px';
    el.style.right = 'auto'; el.style.bottom = 'auto';
    el.style.cursor = 'grabbing'; el.style.zIndex = '9';
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { el: el, id: e.pointerId, dx: e.clientX - r.left, dy: e.clientY - r.top, p: p };
    e.preventDefault();
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag || e.pointerId !== drag.id) return;
    var pr = drag.p.getBoundingClientRect();
    drag.el.style.left = (e.clientX - drag.dx - pr.left) + 'px';
    drag.el.style.top = (e.clientY - drag.dy - pr.top) + 'px';
  });
  function end(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    drag.el.style.cursor = 'grab';
    save();
    drag = null;
  }
  document.addEventListener('pointerup', end);
  document.addEventListener('pointercancel', end);

  restoreAll();
  window.addEventListener('load', restoreAll);
})();
</script>
</body>
</html>
